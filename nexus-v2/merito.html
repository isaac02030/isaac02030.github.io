<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meu mérito — Nexus</title>
  <meta id="cor-da-barra" name="theme-color" content="#0B5F52">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <script>
    (function () {
      try {
        if (!localStorage.getItem("nexus_v2_token")) {
          location.replace("./" + location.search);
          return;
        }
      } catch (erro) {
        location.replace("./");
        return;
      }
      var tema = "";
      try {
        var pedido = new URLSearchParams(location.search).get("tema");
        if (pedido === "claro" || pedido === "escuro" || pedido === "sistema") tema = pedido;
        else tema = localStorage.getItem("nexus_v2_tema") || "";
      } catch (erroTema) {
        tema = "";
      }
      if (tema === "escuro") document.documentElement.setAttribute("data-theme", "dark");
      else if (tema === "claro") document.documentElement.setAttribute("data-theme", "light");
      var escuro = tema === "escuro" || (tema !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var meta = document.getElementById("cor-da-barra");
      if (meta) meta.setAttribute("content", escuro ? "#000000" : "#0B5F52");
    })();
  </script>
  <link rel="preload" href="fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="abas.css">
  <link rel="stylesheet" href="comunidade.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="icons/logo-32.svg" type="image/svg+xml" sizes="32x32">
  <link rel="icon" href="icons/logo-16.svg" type="image/svg+xml" sizes="16x16">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <a class="saltar" href="#conteudo">Pular para o conteúdo</a>
  <!-- Meu mérito (só o próprio; não há perfil dos outros) e, com ?c=<slug>, o
       ranking daquela comunidade: os 3 primeiros e a sua posição.
       Tela de leitura, sóbria: sem luz e sem urso. Textos: comunidade-textos.js. -->
  <main class="pagina-com-abas tela-comunidade tela-merito" id="conteudo">
    <noscript>
      <p class="alerta alerta-rede">O Nexus precisa de JavaScript para abrir o mérito.</p>
    </noscript>

    <a class="btn btn-texto voltar" id="link-voltar" href="comunidades.html" data-texto-comunidade="voltar"></a>
    <h1 class="comunidade-titulo" id="titulo" tabindex="-1" data-texto-comunidade="meritoTitulo"></h1>

    <section class="vista" id="vista-carregando" aria-live="polite">
      <p class="carregando-texto" data-texto-comunidade="abrindoMerito"></p>
    </section>

    <section class="vista" id="vista-aviso" hidden>
      <div id="alerta" class="alerta" role="alert"></div>
      <button type="button" class="btn btn-primario btn-grande" id="btn-tentar" data-texto-comunidade="tentarDeNovo"></button>
    </section>

    <section class="vista" id="vista-idade" hidden>
      <p class="aviso-texto" data-texto-comunidade="idadeAviso"></p>
      <a class="btn btn-secundario btn-grande" id="btn-agora-nao" href="hoje.html" data-texto-comunidade="agoraNao"></a>
    </section>

    <section class="vista" id="vista-merito" hidden>
      <div class="titulo-atual" id="titulo-atual">
        <span id="simbolo-atual"></span>
        <div class="titulo-atual-textos">
          <p class="titulo-atual-nome" id="nome-atual"></p>
          <p class="titulo-atual-conta" id="conta-atual"></p>
        </div>
      </div>
      <p class="linha-proximo-titulo" id="linha-proximo"></p>

      <section class="bloco-lista" aria-labelledby="titulo-titulos">
        <h2 class="secao-titulo" id="titulo-titulos" data-texto-comunidade="titulos"></h2>
        <ul class="lista-titulos" id="lista-titulos"></ul>
      </section>

      <section class="bloco-lista" id="bloco-ranking" aria-labelledby="titulo-ranking" hidden>
        <h2 class="secao-titulo" id="titulo-ranking"></h2>
        <ol class="lista-ranking" id="lista-ranking"></ol>
        <p class="aviso-texto" id="ranking-aviso" hidden></p>
        <div id="alerta-ranking" class="alerta" role="alert" hidden></div>
      </section>
      <p class="regra-merito" id="regra-merito" data-texto-comunidade="regraMerito"></p>

      <div class="linha-reservada">
        <p class="reservada-nome" data-texto-comunidade="pontosEMoedas"></p>
        <p class="reservada-estado" data-texto-comunidade="aindaNao"></p>
      </div>
    </section>
  </main>

  <nav class="abas" id="abas" aria-label="Seções"></nav>
  <script src="comunidade-textos.js"></script>
  <script src="api.js"></script>
  <script src="abas.js"></script>
  <script src="comunidade-base.js"></script>
  <script src="merito.js"></script>
</body>
</html>
