<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Os 30 dias — Nexus</title>
  <meta id="cor-da-barra" name="theme-color" content="#0B5F52">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <script>
    (function () {
      try {
        if (!localStorage.getItem("nexus_v2_token")) {
          location.replace("./" + location.search);
          return;
        }
      } catch (erro) {
        location.replace("./");
        return;
      }
      var tema = "";
      try {
        var pedido = new URLSearchParams(location.search).get("tema");
        if (pedido === "claro" || pedido === "escuro" || pedido === "sistema") tema = pedido;
        else tema = localStorage.getItem("nexus_v2_tema") || "";
      } catch (erroTema) {
        tema = "";
      }
      if (tema === "escuro") document.documentElement.setAttribute("data-theme", "dark");
      else if (tema === "claro") document.documentElement.setAttribute("data-theme", "light");
      var escuro = tema === "escuro" || (tema !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var meta = document.getElementById("cor-da-barra");
      if (meta) meta.setAttribute("content", escuro ? "#161411" : "#0B5F52");
    })();
  </script>
  <link rel="preload" href="fonts/figtree-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="hoje.css">
  <link rel="stylesheet" href="dia-30.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <a class="saltar" href="#conteudo">Pular para o fim do ciclo</a>
  <main class="pagina" id="conteudo">
    <div class="cartao cartao-topo dia-30">
      <noscript>
        <p class="alerta alerta-rede">O Nexus precisa de JavaScript para abrir o fim do ciclo.</p>
      </noscript>

      <section class="vista" id="vista-carregando" aria-live="polite">
        <p class="carregando">
          <span class="spinner" aria-hidden="true"></span>
          <span>Abrindo o fim do ciclo…</span>
        </p>
      </section>

      <section class="vista" id="vista-erro" hidden>
        <div id="alerta-erro" class="alerta" role="alert"></div>
        <button type="button" class="btn btn-primario" id="btn-tentar">Tentar de novo</button>
      </section>

      <section class="vista" id="vista-fim" hidden>
        <h1 class="titulo" id="titulo" tabindex="-1">Os 30 dias chegaram ao fim</h1>
        <div class="marcas" id="marcas" role="img"></div>
        <p class="fato" id="fato"></p>
        <p class="ritmo" id="ritmo"></p>
        <div id="aviso-continuar" class="alerta" role="alert" hidden></div>
        <div class="acoes">
          <button type="button" class="btn btn-primario" id="btn-continuar">Continuar mais 36 dias</button>
          <!-- TODO: quando existir a rota de encerrar, voltar o rótulo para «Encerrar esta missão» e pedir confirmação de uma frase, como em Sair da conta. -->
          <button type="button" class="btn btn-secundario" id="btn-agora">Agora não</button>
        </div>
      </section>
    </div>
  </main>
  <script src="api.js"></script>
  <script src="abas.js"></script>
  <script src="dia-30.js"></script>
</body>
</html>
