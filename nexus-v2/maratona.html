<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maratona — Nexus</title>
  <meta id="cor-da-barra" name="theme-color" content="#0B5F52">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <script>
    (function () {
      try {
        if (!localStorage.getItem("nexus_v2_token")) {
          location.replace("./" + location.search);
          return;
        }
      } catch (erro) {
        location.replace("./");
        return;
      }
      var tema = "";
      try {
        var pedido = new URLSearchParams(location.search).get("tema");
        if (pedido === "claro" || pedido === "escuro" || pedido === "sistema") tema = pedido;
        else tema = localStorage.getItem("nexus_v2_tema") || "";
      } catch (erroTema) {
        tema = "";
      }
      if (tema === "escuro") document.documentElement.setAttribute("data-theme", "dark");
      else if (tema === "claro") document.documentElement.setAttribute("data-theme", "light");
      var escuro = tema === "escuro" || (tema !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var meta = document.getElementById("cor-da-barra");
      if (meta) meta.setAttribute("content", escuro ? "#000000" : "#0B5F52");
    })();
  </script>
  <link rel="preload" href="fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="abas.css">
  <link rel="stylesheet" href="comunidade.css">
  <link rel="stylesheet" href="maratona.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="icons/logo-32.svg" type="image/svg+xml" sizes="32x32">
  <link rel="icon" href="icons/logo-16.svg" type="image/svg+xml" sizes="16x16">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <a class="saltar" href="#conteudo">Pular para o conteúdo</a>
  <!-- Maratona da comunidade. Papel liso no claro, preto de verdade no escuro.
       Sem urso, sem cartão com sombra, sem ranking individual e sem sair.
       Texto de outra pessoa entra só por textContent. -->
  <main class="pagina-com-abas tela-maratona" id="conteudo">
    <noscript>
      <p class="alerta alerta-rede">O Nexus precisa de JavaScript para abrir a maratona.</p>
    </noscript>

    <a class="btn btn-texto voltar" id="link-voltar" href="comunidade.html" data-texto-maratona="voltar"></a>

    <section class="vista" id="vista-carregando" aria-live="polite">
      <p class="carregando-texto" data-texto-maratona="abrindo"></p>
    </section>

    <section class="vista" id="vista-aviso" hidden>
      <div id="alerta" class="alerta" role="alert"></div>
      <button type="button" class="btn btn-primario btn-grande" id="btn-tentar" data-texto-maratona="tentarDeNovo"></button>
    </section>

    <section class="vista" id="vista-idade" hidden>
      <p class="aviso-texto" data-texto-maratona="idadeAviso"></p>
      <a class="btn btn-secundario btn-grande" id="btn-agora-nao" href="hoje.html" data-texto-maratona="agoraNao"></a>
    </section>

    <section class="vista" id="vista-lista" hidden>
      <h1 class="comunidade-titulo" id="titulo-lista" tabindex="-1" data-texto-maratona="listaTitulo"></h1>
      <ul class="lista-maratonas" id="lista-maratonas"></ul>
      <p class="vazio-texto" id="lista-vazia" data-texto-maratona="semMaratona" hidden></p>
      <a class="btn btn-secundario btn-grande" id="link-criar" href="maratona.html?criar=1" data-texto-maratona="criarLinha" hidden></a>
    </section>

    <section class="vista" id="vista-detalhe" hidden>
      <h1 class="comunidade-titulo" id="nome-maratona" tabindex="-1"></h1>
      <p class="maratona-dia" id="texto-dia-maratona" hidden></p>
      <p class="maratona-minimo"><span data-texto-maratona="minimoRotulo"></span><span id="valor-minimo"></span></p>
      <p class="maratona-grupo" id="texto-grupo"></p>
      <p class="maratona-meu-dia" id="texto-meu-dia" hidden></p>
      <ol class="trilha-maratona" id="trilha" role="img" aria-label=""></ol>
      <p class="so-leitor" id="resumo-trilha"></p>
      <button type="button" class="btn btn-primario btn-grande btn-luz" id="btn-registrar" aria-busy="false" hidden>
        <span class="btn-rotulo" data-texto-maratona="registrarDia"></span>
      </button>
      <button type="button" class="btn btn-primario btn-grande" id="btn-entrar" aria-busy="false" hidden data-texto-maratona="entrarNaMaratona"></button>
      <p class="aviso-texto" id="aviso-registro" role="status" aria-live="polite" hidden></p>
      <div id="alerta-maratona" class="alerta" role="alert" hidden></div>
    </section>

    <section class="vista" id="vista-criar" hidden>
      <h1 class="comunidade-titulo" id="titulo-criar" tabindex="-1" data-texto-maratona="criarTitulo"></h1>
      <form class="formulario-maratona" id="form-criar" method="post" action="#criar" novalidate>
        <div id="alerta-criar" class="alerta" role="alert" hidden></div>
        <div class="campo">
          <label for="nome-maratona-campo" data-texto-maratona="campoNome"></label>
          <p class="dica" id="nome-ajuda" data-texto-maratona="nomeAjuda"></p>
          <input id="nome-maratona-campo" name="title" type="text" maxlength="60" autocomplete="off" aria-invalid="false" aria-describedby="nome-ajuda nome-contador nome-erro">
          <p class="contador" id="nome-contador">0 de 60</p>
          <p class="erro-campo" id="nome-erro" hidden></p>
        </div>
        <div class="campo">
          <label for="minimo-campo" data-texto-maratona="campoMinimo"></label>
          <p class="dica" id="minimo-ajuda" data-texto-maratona="minimoAjuda"></p>
          <input id="minimo-campo" name="description" type="text" maxlength="140" autocomplete="off" aria-invalid="false" aria-describedby="minimo-ajuda minimo-contador minimo-erro">
          <p class="contador" id="minimo-contador">0 de 140</p>
          <p class="erro-campo" id="minimo-erro" hidden></p>
        </div>
        <div class="dupla">
          <div class="campo">
            <label for="dias-campo" data-texto-maratona="campoDias"></label>
            <input id="dias-campo" name="duration_days" type="number" min="3" max="30" step="1" value="7" inputmode="numeric" aria-invalid="false" aria-describedby="dias-erro">
            <p class="erro-campo" id="dias-erro" hidden></p>
          </div>
          <div class="campo">
            <label for="pessoas-campo" data-texto-maratona="campoPessoas"></label>
            <input id="pessoas-campo" name="max_participants" type="number" min="2" max="100" step="1" value="100" inputmode="numeric" aria-invalid="false" aria-describedby="pessoas-erro">
            <p class="erro-campo" id="pessoas-erro" hidden></p>
          </div>
        </div>
        <div class="campo">
          <label for="inicio-campo" data-texto-maratona="campoInicio"></label>
          <p class="dica" id="inicio-ajuda" data-texto-maratona="campoInicioAjuda"></p>
          <input id="inicio-campo" name="start_day" type="date" autocomplete="off" aria-invalid="false" aria-describedby="inicio-ajuda inicio-erro">
          <p class="erro-campo" id="inicio-erro" hidden></p>
        </div>
        <div class="botoes">
          <button type="submit" class="btn btn-primario" id="btn-criar" aria-busy="false" data-texto-maratona="criarBotao"></button>
          <a class="btn btn-secundario" id="btn-cancelar-criar" href="comunidade.html" data-texto-maratona="cancelar"></a>
        </div>
      </form>
    </section>
  </main>

  <dialog class="folha dialogo-maratona" id="dialogo-maratona" aria-labelledby="titulo-dialogo-maratona">
    <h2 class="folha-titulo" id="titulo-dialogo-maratona" data-texto-maratona="dialogoTitulo"></h2>
    <p id="texto-dialogo-maratona" data-texto-maratona="dialogoTexto"></p>
    <div class="botoes">
      <button type="button" class="btn btn-secundario" id="btn-entrar-maratona" aria-busy="false" data-texto-maratona="entrar"></button>
      <button type="button" class="btn btn-secundario" id="btn-agora-nao-maratona" data-texto-maratona="agoraNao"></button>
    </div>
  </dialog>

  <nav class="abas" id="abas" aria-label="Seções"></nav>
  <script src="comunidade-textos.js"></script>
  <script src="maratona-textos.js"></script>
  <script src="api.js"></script>
  <script src="abas.js"></script>
  <script src="comunidade-base.js"></script>
  <script src="maratona.js"></script>
</body>
</html>
