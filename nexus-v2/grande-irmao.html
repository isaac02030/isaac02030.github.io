<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>O Grande Irmão — Nexus</title>
  <meta id="cor-da-barra" name="theme-color" content="#0B5F52">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <script>
    (function () {
      try {
        if (!localStorage.getItem("nexus_v2_token")) {
          location.replace("./" + location.search);
          return;
        }
      } catch (erro) {
        location.replace("./");
        return;
      }
      var tema = "";
      try {
        var pedido = new URLSearchParams(location.search).get("tema");
        if (pedido === "claro" || pedido === "escuro" || pedido === "sistema") tema = pedido;
        else tema = localStorage.getItem("nexus_v2_tema") || "";
      } catch (erroTema) {
        tema = "";
      }
      if (tema === "escuro") document.documentElement.setAttribute("data-theme", "dark");
      else if (tema === "claro") document.documentElement.setAttribute("data-theme", "light");
      var escuro = tema === "escuro" || (tema !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var meta = document.getElementById("cor-da-barra");
      if (meta) meta.setAttribute("content", escuro ? "#000000" : "#0B5F52");

      /* Não abre sozinha. Só depois do check-in, do dia difícil, ou com um mock na URL. */
      var params;
      try {
        params = new URLSearchParams(location.search);
      } catch (erroBusca) {
        params = new URLSearchParams();
      }
      var host = location.hostname;
      var emDev = host === "localhost" || host === "127.0.0.1" || host === "[::1]" || host === "::1";
      var cenario = params.get("cenario") || "";
      var mocks = {
        cumpriu: true,
        dificil: true,
        "dia-dificil": true,
        volta: true,
        offline: true
      };
      if (emDev) mocks["ia-exemplo"] = true;
      var passo = false;
      try {
        var bruto = sessionStorage.getItem("nexus_v2_passo_grande_irmao");
        if (bruto) {
          var dados = JSON.parse(bruto);
          passo = !!(dados && (dados.tipo === "checkin" || dados.tipo === "dificil"));
        }
      } catch (erroPasso) {
        passo = false;
      }
      if (!mocks[cenario] && params.get("rede") !== "off" && !passo) {
        var manter = new URLSearchParams();
        if (params.get("tema")) manter.set("tema", params.get("tema"));
        if (params.get("cenario")) manter.set("cenario", params.get("cenario"));
        if (params.get("rede")) manter.set("rede", params.get("rede"));
        var texto = manter.toString();
        location.replace("hoje.html" + (texto ? "?" + texto : ""));
      }
    })();
  </script>
  <link rel="preload" href="fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="grande-irmao.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="icons/logo-32.svg" type="image/svg+xml" sizes="32x32">
  <link rel="icon" href="icons/logo-16.svg" type="image/svg+xml" sizes="16x16">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <a class="saltar" href="#conteudo">Pular para a resposta</a>
  <main class="pagina" id="conteudo">
    <div class="cartao cartao-topo grande-irmao">
      <noscript>
        <p class="alerta alerta-rede">O Nexus precisa de JavaScript para mostrar esta resposta.</p>
      </noscript>
      <h1 class="titulo" id="titulo" tabindex="-1">O Grande Irmão</h1>
      <p class="texto-resposta" id="texto"></p>
      <p class="apoio-ia" id="apoio-ia" hidden>Isso é uma IA. Ela acompanha a missão, não substitui gente de verdade.</p>
      <a class="btn btn-texto continuar" id="continuar" href="grande-irmao.html" hidden aria-disabled="true">Quero continuar esta conversa</a>
      <a class="btn btn-primario" id="voltar-hoje" href="hoje.html">Voltar a Hoje</a>
    </div>
  </main>
  <script src="api.js"></script>
  <script src="abas.js"></script>
  <script>
    (function () {
      var host = location.hostname;
      if (host === "localhost" || host === "127.0.0.1" || host === "[::1]" || host === "::1") {
        document.write('<script src="dev/ia-exemplo.js"><\/script>');
      }
    })();
  </script>
  <script src="grande-irmao.js"></script>
</body>
</html>
