<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Convite — Nexus</title>
  <meta id="cor-da-barra" name="theme-color" content="#0B5F52">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <!-- O token do convite vem no fragmento (#t=…), que não sai do navegador.
       Esta página não manda para a entrada sem login: ela pede login com uma frase. -->
  <meta name="referrer" content="no-referrer">
  <script>
    (function () {
      var tema = "";
      try {
        var pedido = new URLSearchParams(location.search).get("tema");
        if (pedido === "claro" || pedido === "escuro" || pedido === "sistema") tema = pedido;
        else tema = localStorage.getItem("nexus_v2_tema") || "";
      } catch (erroTema) {
        tema = "";
      }
      if (tema === "escuro") document.documentElement.setAttribute("data-theme", "dark");
      else if (tema === "claro") document.documentElement.setAttribute("data-theme", "light");
      var escuro = tema === "escuro" || (tema !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var meta = document.getElementById("cor-da-barra");
      if (meta) meta.setAttribute("content", escuro ? "#000000" : "#0B5F52");
    })();
  </script>
  <link rel="preload" href="fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="abas.css">
  <link rel="stylesheet" href="aceitar-convite.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="icons/logo-32.svg" type="image/svg+xml" sizes="32x32">
  <link rel="icon" href="icons/logo-16.svg" type="image/svg+xml" sizes="16x16">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <a class="saltar" href="#conteudo">Pular para o conteúdo</a>
  <!-- Aceitar convite (Duo ou Rival). Sem urso. Luz: só o botão «Aceitar convite». -->
  <main class="pagina-convite" id="conteudo">
    <noscript>
      <p class="alerta alerta-rede">O Nexus precisa de JavaScript para abrir o convite.</p>
    </noscript>

    <h1 class="titulo-convite" id="titulo" tabindex="-1" data-texto-convite="tituloGeral"></h1>

    <section class="vista" id="vista-carregando" aria-live="polite">
      <p class="texto-convite" data-texto-convite="abrindo"></p>
    </section>

    <!-- Sem login: uma frase e o caminho para entrar. Nada vai ao servidor. -->
    <section class="vista" id="vista-entrar" hidden>
      <p class="texto-convite" data-texto-convite="entrarPrimeiro"></p>
      <!-- Ao tocar em «Entrar», o token fica só nesta aba até a pessoa voltar. -->
      <a class="btn btn-secundario" id="link-entrar" href="./" data-texto-convite="entrar"></a>
    </section>

    <section class="vista" id="vista-erro" hidden>
      <div id="alerta-erro" class="alerta alerta-neutro" role="alert"></div>
      <a class="btn btn-secundario" id="link-missao-erro" href="missao.html" data-texto-convite="irParaMissao"></a>
    </section>

    <section class="vista" id="vista-convite" hidden>
      <p class="de-quem" id="de-quem"></p>
      <p class="desafio" id="desafio" hidden></p>
      <p class="texto-convite" id="explica"></p>
      <p class="texto-convite" id="ve"></p>
      <p class="texto-convite apoio-pontos" id="pontos" data-texto-convite="pontos" hidden></p>
      <div id="alerta-aceitar" class="alerta alerta-neutro" role="alert" hidden></div>
      <div class="botoes-convite">
        <button type="button" class="btn btn-primario btn-luz" id="btn-aceitar" aria-busy="false">
          <span class="btn-rotulo" data-texto-convite="aceitar"></span>
        </button>
        <!-- «Agora não» com o mesmo peso: não gasta o convite. -->
        <a class="btn btn-secundario" id="link-agora-nao" href="hoje.html" data-texto-convite="agoraNao"></a>
      </div>
    </section>

    <section class="vista" id="vista-feito" hidden>
      <div id="aviso-feito" class="alerta alerta-ok" role="status"></div>
      <a class="btn btn-secundario" id="link-missao" href="missao.html" data-texto-convite="irParaMissao"></a>
    </section>
  </main>
  <nav class="abas" id="abas" aria-label="Seções" hidden></nav>
  <script src="convite.js"></script>
  <script src="api.js"></script>
  <script src="abas.js"></script>
  <script src="aceitar-convite.js"></script>
</body>
</html>
