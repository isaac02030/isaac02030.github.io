<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Comunidades — Nexus</title>
  <meta id="cor-da-barra" name="theme-color" content="#0B5F52">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <script>
    (function () {
      try {
        if (!localStorage.getItem("nexus_v2_token")) {
          location.replace("./" + location.search);
          return;
        }
      } catch (erro) {
        location.replace("./");
        return;
      }
      var tema = "";
      try {
        var pedido = new URLSearchParams(location.search).get("tema");
        if (pedido === "claro" || pedido === "escuro" || pedido === "sistema") tema = pedido;
        else tema = localStorage.getItem("nexus_v2_tema") || "";
      } catch (erroTema) {
        tema = "";
      }
      if (tema === "escuro") document.documentElement.setAttribute("data-theme", "dark");
      else if (tema === "claro") document.documentElement.setAttribute("data-theme", "light");
      var escuro = tema === "escuro" || (tema !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var meta = document.getElementById("cor-da-barra");
      if (meta) meta.setAttribute("content", escuro ? "#000000" : "#0B5F52");
    })();
  </script>
  <link rel="preload" href="fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="abas.css">
  <link rel="stylesheet" href="comunidade.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="icons/logo-32.svg" type="image/svg+xml" sizes="32x32">
  <link rel="icon" href="icons/logo-16.svg" type="image/svg+xml" sizes="16x16">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <a class="saltar" href="#conteudo">Pular para o conteúdo</a>
  <!-- Lista de comunidades por área. Tela sóbria: sem luz e sem urso.
       Os textos vêm de comunidade-textos.js. -->
  <main class="pagina-com-abas tela-comunidade" id="conteudo">
    <noscript>
      <p class="alerta alerta-rede">O Nexus precisa de JavaScript para abrir as comunidades.</p>
    </noscript>

    <h1 class="comunidade-titulo" id="titulo" tabindex="-1" data-texto-comunidade="comunidadesTitulo"></h1>

    <section class="vista" id="vista-carregando" aria-live="polite">
      <p class="carregando-texto" data-texto-comunidade="abrindoComunidades"></p>
    </section>

    <section class="vista" id="vista-aviso" hidden>
      <div id="alerta" class="alerta" role="alert"></div>
      <button type="button" class="btn btn-primario btn-grande" id="btn-tentar" data-texto-comunidade="tentarDeNovo"></button>
    </section>

    <section class="vista" id="vista-idade" hidden>
      <p class="aviso-texto" data-texto-comunidade="idadeAviso"></p>
      <a class="btn btn-secundario btn-grande" id="btn-agora-nao" href="hoje.html" data-texto-comunidade="agoraNao"></a>
    </section>

    <section class="vista" id="vista-lista" hidden>
      <div class="segmentos" id="segmentos"></div>

      <div class="sem-missao" id="sem-missao" hidden>
        <p class="aviso-texto" data-texto-comunidade="semMissaoLer"></p>
        <a class="btn btn-texto link-linha" id="link-comecar" href="onboarding.html" data-texto-comunidade="comecarMissao"></a>
      </div>

      <div id="alerta-entrar" class="alerta" role="alert" hidden></div>

      <section class="bloco-lista" id="bloco-recomendadas" aria-labelledby="titulo-recomendadas" hidden>
        <h2 class="secao-titulo" id="titulo-recomendadas" data-texto-comunidade="recomendadas"></h2>
        <ul class="lista-comunidades" id="lista-recomendadas"></ul>
      </section>

      <section class="bloco-lista" aria-labelledby="titulo-todas">
        <h2 class="secao-titulo" id="titulo-todas"></h2>
        <ul class="lista-comunidades" id="lista-todas"></ul>
        <p class="vazio-texto" id="area-vazia" data-texto-comunidade="areaVazia" hidden></p>
      </section>

      <a class="linha-seta" id="link-criar" href="criar-comunidade.html"><span data-texto-comunidade="criarLinha"></span><svg class="seta" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg></a>
    </section>
  </main>

  <nav class="abas" id="abas" aria-label="Seções"></nav>
  <script src="comunidade-textos.js"></script>
  <script src="api.js"></script>
  <script src="abas.js"></script>
  <script src="comunidade-base.js"></script>
  <script src="comunidades.js"></script>
</body>
</html>
