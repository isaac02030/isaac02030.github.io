<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dia difícil — Nexus</title>
  <meta id="cor-da-barra" name="theme-color" content="#0B5F52">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <script>
    (function () {
      try {
        if (!localStorage.getItem("nexus_v2_token")) {
          location.replace("./" + location.search);
          return;
        }
      } catch (erro) {
        location.replace("./");
        return;
      }
      var tema = "";
      try {
        var pedido = new URLSearchParams(location.search).get("tema");
        if (pedido === "claro" || pedido === "escuro" || pedido === "sistema") tema = pedido;
        else tema = localStorage.getItem("nexus_v2_tema") || "";
      } catch (erroTema) {
        tema = "";
      }
      if (tema === "escuro") document.documentElement.setAttribute("data-theme", "dark");
      else if (tema === "claro") document.documentElement.setAttribute("data-theme", "light");
      var escuro = tema === "escuro" || (tema !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var meta = document.getElementById("cor-da-barra");
      if (meta) meta.setAttribute("content", escuro ? "#161411" : "#0B5F52");
    })();
  </script>
  <link rel="preload" href="fonts/figtree-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="checkin.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <a class="saltar" href="#conteudo">Pular para o conteúdo</a>
  <main class="pagina" id="conteudo">
    <section class="cartao cartao-topo checkin">
      <a class="btn btn-texto btn-voltar" id="voltar" href="checkin.html">Voltar</a>
      <h1 class="titulo" id="titulo" tabindex="-1">Dia difícil</h1>
      <p class="apoio">Esta tela chega em breve.</p>
    </section>
  </main>
  <script src="abas.js"></script>
  <script>
    document.getElementById("voltar").href = "checkin.html" + NexusAbas.busca(["tema", "cenario", "rede"]);
    NexusAbas.focar(document.getElementById("titulo"));
    NexusAbas.concluirRolagem();
  </script>
</body>
</html>
