<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dia difícil — Nexus</title>
  <meta id="cor-da-barra" name="theme-color" content="#0B5F52">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <script>
    (function () {
      try {
        if (!localStorage.getItem("nexus_v2_token")) {
          location.replace("./" + location.search);
          return;
        }
      } catch (erro) {
        location.replace("./");
        return;
      }
      var tema = "";
      try {
        var pedido = new URLSearchParams(location.search).get("tema");
        if (pedido === "claro" || pedido === "escuro" || pedido === "sistema") tema = pedido;
        else tema = localStorage.getItem("nexus_v2_tema") || "";
      } catch (erroTema) {
        tema = "";
      }
      if (tema === "escuro") document.documentElement.setAttribute("data-theme", "dark");
      else if (tema === "claro") document.documentElement.setAttribute("data-theme", "light");
      var escuro = tema === "escuro" || (tema !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var meta = document.getElementById("cor-da-barra");
      if (meta) meta.setAttribute("content", escuro ? "#161411" : "#0B5F52");
    })();
  </script>
  <link rel="preload" href="fonts/figtree-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/figtree-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="checkin.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <a class="saltar" href="#conteudo">Pular para o dia difícil</a>
  <main class="pagina" id="conteudo">
    <div class="cartao cartao-topo checkin">
      <noscript>
        <p class="alerta alerta-rede">O Nexus precisa de JavaScript para registrar o dia difícil.</p>
      </noscript>

      <a class="btn btn-texto btn-voltar" id="voltar" href="checkin.html">Voltar</a>
      <h1 class="titulo" id="titulo" tabindex="-1">Dia difícil</h1>

      <section class="vista" id="vista-carregando" aria-live="polite">
        <p class="carregando">
          <span class="spinner" aria-hidden="true"></span>
          <span>Abrindo o dia…</span>
        </p>
      </section>

      <section class="vista" id="vista-erro" hidden>
        <div id="alerta-erro" class="alerta" role="alert"></div>
        <button type="button" class="btn btn-primario" id="btn-tentar">Tentar de novo</button>
      </section>

      <section class="vista" id="vista-bloqueio" hidden>
        <p class="apoio" id="texto-bloqueio" role="status"></p>
        <a class="btn btn-primario" id="btn-voltar-hoje" href="hoje.html">Voltar a Hoje</a>
      </section>

      <section class="vista" id="vista-limite" hidden>
        <p class="bloco-limite" id="texto-limite" role="status"></p>
        <a class="btn btn-primario" id="btn-dia-normal" href="checkin.html">Registrar o dia normal</a>
      </section>

      <section class="vista" id="vista-form" hidden>
        <p class="apoio" id="apoio"></p>
        <div class="bloco-pergunta" id="bloco-minimo" hidden>
          <p class="rotulo-minimo">O mínimo de hoje continua valendo:</p>
          <p class="minimo-hoje" id="minimo-hoje"><strong id="minimo-valor"></strong></p>
        </div>
        <form class="formulario" id="form-nota" method="post" action="dia-dificil.html" novalidate>
          <div class="campo">
            <label for="nota">Escreva uma nota curta do que fez.</label>
            <textarea id="nota" name="note" rows="3" autocomplete="off" autocapitalize="sentences" aria-required="true" aria-describedby="nota-ajuda nota-erro"></textarea>
            <p id="nota-ajuda" class="dica"></p>
            <p id="nota-erro" class="erro-campo" role="alert" hidden></p>
          </div>
          <div id="alerta" class="alerta" role="alert" hidden></div>
          <button type="submit" class="btn btn-primario" id="btn-registrar" data-texto="Registrar o dia difícil" data-carregando="Registrando…" aria-busy="false">
            <span class="btn-rotulo">Registrar o dia difícil</span>
            <span class="spinner" hidden aria-hidden="true"></span>
          </button>
        </form>
      </section>

      <section class="vista" id="vista-sucesso" hidden>
        <p class="sucesso" id="sucesso" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>
    </div>
  </main>
  <script src="api.js"></script>
  <script src="abas.js"></script>
  <script src="dia-dificil.js"></script>
</body>
</html>
