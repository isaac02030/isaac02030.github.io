<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recuperação — Nexus</title>
  <meta id="cor-da-barra" name="theme-color" content="#0B5F52">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <script>
    (function () {
      try {
        if (!localStorage.getItem("nexus_v2_token")) {
          location.replace("./" + location.search);
          return;
        }
      } catch (erro) {
        location.replace("./");
        return;
      }
      location.replace("hoje.html" + location.search);
    })();
  </script>
  <link rel="preload" href="fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="abas.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <a class="saltar" href="#conteudo">Pular para o conteúdo</a>
  <main class="pagina pagina-com-abas" id="conteudo">
    <section class="cartao">
      <header class="cabecalho">
        <p class="marca">Nexus</p>
        <h1 class="titulo" id="titulo" tabindex="-1">Recuperação</h1>
        <p class="apoio">O dia está no Hoje.</p>
        <a class="btn btn-primario" id="ir-hoje" href="hoje.html">Ir para Hoje</a>
      </header>
    </section>
  </main>
  <nav class="abas" id="abas" aria-label="Seções"></nav>
  <script src="abas.js"></script>
  <script>
    var ir = document.getElementById("ir-hoje");
    if (ir) ir.href = "hoje.html" + location.search;
    NexusAbas.iniciar("hoje");
  </script>
</body>
</html>
