<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Criar uma comunidade — Nexus</title>
  <meta id="cor-da-barra" name="theme-color" content="#0B5F52">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus">
  <script>
    (function () {
      try {
        if (!localStorage.getItem("nexus_v2_token")) {
          location.replace("./" + location.search);
          return;
        }
      } catch (erro) {
        location.replace("./");
        return;
      }
      var tema = "";
      try {
        var pedido = new URLSearchParams(location.search).get("tema");
        if (pedido === "claro" || pedido === "escuro" || pedido === "sistema") tema = pedido;
        else tema = localStorage.getItem("nexus_v2_tema") || "";
      } catch (erroTema) {
        tema = "";
      }
      if (tema === "escuro") document.documentElement.setAttribute("data-theme", "dark");
      else if (tema === "claro") document.documentElement.setAttribute("data-theme", "light");
      var escuro = tema === "escuro" || (tema !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var meta = document.getElementById("cor-da-barra");
      if (meta) meta.setAttribute("content", escuro ? "#000000" : "#0B5F52");
    })();
  </script>
  <link rel="preload" href="fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="abas.css">
  <link rel="stylesheet" href="comunidade.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="icons/logo-32.svg" type="image/svg+xml" sizes="32x32">
  <link rel="icon" href="icons/logo-16.svg" type="image/svg+xml" sizes="16x16">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <a class="saltar" href="#conteudo">Pular para o conteúdo</a>
  <!-- Criar comunidade: só para quem concluiu uma missão de 30 dias (o servidor
       decide). Tela sóbria: sem luz e sem urso. Textos: comunidade-textos.js. -->
  <main class="pagina-com-abas tela-comunidade" id="conteudo">
    <noscript>
      <p class="alerta alerta-rede">O Nexus precisa de JavaScript para criar uma comunidade.</p>
    </noscript>

    <a class="btn btn-texto voltar" id="link-voltar" href="comunidades.html" data-texto-comunidade="voltar"></a>
    <h1 class="comunidade-titulo" id="titulo" tabindex="-1" data-texto-comunidade="criarTitulo"></h1>

    <section class="vista" id="vista-carregando" aria-live="polite">
      <p class="carregando-texto" data-texto-comunidade="abrindo"></p>
    </section>

    <section class="vista" id="vista-aviso" hidden>
      <div id="alerta" class="alerta" role="alert"></div>
      <button type="button" class="btn btn-primario btn-grande" id="btn-tentar" data-texto-comunidade="tentarDeNovo"></button>
    </section>

    <section class="vista" id="vista-idade" hidden>
      <p class="aviso-texto" data-texto-comunidade="idadeAviso"></p>
      <a class="btn btn-secundario btn-grande" id="btn-agora-nao" href="hoje.html" data-texto-comunidade="agoraNao"></a>
    </section>

    <!-- Ainda sem uma missão de 30 dias concluída: o fato e o número, sem cadeado. -->
    <section class="vista" id="vista-bloqueado" hidden>
      <p class="aviso-texto" data-texto-comunidade="criarBloqueado"></p>
      <p class="aviso-texto" id="dia-da-missao" hidden></p>
      <a class="btn btn-secundario btn-grande" id="link-missao" href="missao.html"></a>
    </section>

    <section class="vista" id="vista-form" hidden>
      <form class="formulario criar" id="form-criar" method="post" action="#criar" novalidate>
        <div class="campo">
          <label for="campo-nome" data-texto-comunidade="campoNome"></label>
          <input id="campo-nome" name="name" type="text" maxlength="40" autocomplete="off" aria-describedby="erro-nome">
          <p class="erro-campo" id="erro-nome" role="alert"></p>
        </div>
        <fieldset class="motivos campo-area" aria-describedby="erro-area">
          <legend class="legenda-campo" data-texto-comunidade="campoArea"></legend>
          <div id="opcoes-area"></div>
          <p class="erro-campo" id="erro-area" role="alert"></p>
        </fieldset>
        <div class="campo">
          <label for="campo-assunto"><span data-texto-comunidade="campoAssunto"></span> <span class="opcional" data-texto-comunidade="opcional"></span></label>
          <input id="campo-assunto" name="category" type="text" maxlength="30" autocomplete="off" aria-describedby="ajuda-assunto erro-assunto">
          <p class="apoio" id="ajuda-assunto" data-texto-comunidade="campoAssuntoAjuda"></p>
          <p class="erro-campo" id="erro-assunto" role="alert"></p>
        </div>
        <div class="campo">
          <label for="campo-regras"><span data-texto-comunidade="campoRegras"></span> <span class="opcional" data-texto-comunidade="opcional"></span></label>
          <textarea id="campo-regras" name="description" rows="3" maxlength="200" aria-describedby="erro-regras"></textarea>
          <p class="erro-campo" id="erro-regras" role="alert"></p>
        </div>
        <div class="campo">
          <label for="campo-icone"><span data-texto-comunidade="campoIcone"></span> <span class="opcional" data-texto-comunidade="opcional"></span></label>
          <input id="campo-icone" class="campo-icone" name="icon" type="text" maxlength="8" autocomplete="off" aria-describedby="ajuda-icone erro-icone">
          <p class="apoio" id="ajuda-icone" data-texto-comunidade="campoIconeAjuda"></p>
          <p class="erro-campo" id="erro-icone" role="alert"></p>
        </div>
        <div id="alerta-criar" class="alerta" role="alert" hidden></div>
        <button type="submit" class="btn btn-primario btn-grande" id="btn-criar" aria-busy="false">
          <span class="btn-rotulo" data-texto-comunidade="criarBotao"></span>
        </button>
      </form>
    </section>

    <section class="vista" id="vista-criada" hidden>
      <p class="aviso-texto" id="texto-criada" role="status" tabindex="-1" data-texto-comunidade="criada"></p>
      <a class="btn btn-secundario btn-grande" id="link-nova" href="comunidade.html" data-texto-comunidade="abrirComunidade"></a>
    </section>
  </main>

  <nav class="abas" id="abas" aria-label="Seções"></nav>
  <script src="comunidade-textos.js"></script>
  <script src="api.js"></script>
  <script src="abas.js"></script>
  <script src="comunidade-base.js"></script>
  <script src="criar-comunidade.js"></script>
</body>
</html>
